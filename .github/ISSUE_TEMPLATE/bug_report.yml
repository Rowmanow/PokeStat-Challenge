name: Signaler un bug
description: Signaler un problème reproductible dans PokeStat Challenge
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Appareil
      description: Modèle du téléphone ou ordinateur
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Système
      description: Version Android ou Windows
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Stat Draft, Stat Guesser, Accueil, Installation]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Décris précisément ce qui a été fait avant le problème.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran ou détails supplémentaires
